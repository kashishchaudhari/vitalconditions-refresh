# Source-to-target validation settings (Module C).
# severity: "fail" stops the pipeline (and blocks publishing); "warn" is
# reported but does not stop anything.

severity:
  completeness: fail        # expected rows / tracts / groups all present
  source_match: fail        # every directly-sourced row equals the raw API pull
  reconciliation: fail      # independent re-pull of a random sample matches exactly
  derived: fail             # percentages recomputed from their parts match
  consistency: fail         # parts sum to totals, numerator <= denominator
  rules: fail               # schema, value ranges, required fields, 2020 rule
  legacy: warn              # differences from previously published figures

reconciliation:
  sample_fraction: 0.05     # share of directly-sourced rows re-pulled
  min_rows: 25              # but never fewer than this
  # "auto" derives the seed from the output file's hash, so the sample is
  # reproducible for a given output and changes when the data changes.
  seed: auto

derived:
  tolerance: 1.0e-6         # absolute tolerance for recomputed values

consistency:
  # Subgroups must sum to the total within this multiple of the combined MOE.
  moe_multiplier: 1.0

legacy:
  # Relative difference above which a legacy comparison is flagged (warning).
  relative_tolerance: 0.05

pums:
  # Weighted PUMS totals vs published ACS totals (milestone 3).
  relative_tolerance: 0.02
