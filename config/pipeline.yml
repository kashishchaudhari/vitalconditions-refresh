# Pipeline settings. Edit these, not the R code, for routine changes.

area:
  state_fips: "37"          # North Carolina
  county_fips: "067"        # Forsyth County
  county_geoid: "37067"
  state_abbr: "NC"
  county_name: "Forsyth County"

acs:
  # Earliest year to pull. Vintages after this are detected at run time by
  # asking the Census API which years exist; no year is hard-coded.
  start_year: 2009
  surveys: [acs1, acs5]
  # Census publishes margins of error at the 90% confidence level.
  moe_level: 90

reliability:
  # Coefficient of variation (CV, %) cut points:
  #   CV < reliable_cv_max                  -> reliable
  #   reliable_cv_max <= CV <= caution_cv_max -> use_with_caution
  #   CV > caution_cv_max                   -> suppress
  reliable_cv_max: 15
  caution_cv_max: 30
  # Percentages whose denominator (base) is below this count are suppressed.
  min_denominator: 50

pums:
  # PUMAs covering Forsyth County. In both the 2010 and 2020 PUMA definitions
  # these three PUMAs cover exactly the county (verified, docs/assumptions.md).
  pumas: ["01801", "01802", "01803"]
  # Which PUMS releases to build. "latest" is detected from the Census API.
  # 2019 5-year (2015-2019) matches the legacy site's vintage.
  acs5_years: [2019, latest]
  acs1_years: [latest]
  # Suppress PUMS estimates whose denominator has fewer sample cases than this.
  min_sample_cases: 30

childcare:
  # Facility list (schema: data/childcare/README.md). This is a SAMPLE
  # PLACEHOLDER of fake facilities until real data is obtained.
  facilities_csv: data/childcare/facilities_SAMPLE.csv
  # "Nearby" supply: straight-line distance from each tract's interior point.
  buffer_miles: 2
  # NC State Plane (meters), used for distances and simplification.
  projected_crs: 32119
  simplify_meters: 25
  market_rate:
    monthly_dollars: 1400
    label: >-
      the NC DCDEE subsidized child care market rate for a 5-star center,
      infant-toddler, Forsyth County, effective Oct 1, 2026 ($1,400/month)
    source_url: https://ncchildcare.ncdhhs.gov/Home/DCDEE-Sections/Subsidy-Services/Market-Rates
    source_file: Centers_Market_Rates_FINAL_9-17-2026-003.pdf
    caveat: >-
      Subsidy reimbursement rates reflect the highest of a 2021 statewide floor,
      the 2023 county market rate and the current rate. They are not the
      price every family pays.
  thresholds:
    # Fewer than 1 slot per 3 young children (33.3 per 100) is the common
    # "child care desert" definition (Center for American Progress).
    low_supply_slots_per_100: 33.3
    # U.S. HHS treats child care costing 7% of family income or less as
    # affordable (2016 CCDF rule).
    affordable_pct_of_income: 7

paths:
  cache_dir: data/cache/acs
  tableau_dir: outputs/tableau
  validation_dir: outputs/validation
