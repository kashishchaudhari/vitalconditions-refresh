      - {group: "White alone",                                  table: B19113A}
      - {group: "Black or African American alone",              table: B19113B}
      - {group: "American Indian and Alaska Native alone",      table: B19113C}
      - {group: "Asian alone",                                  table: B19113D}
      - {group: "Native Hawaiian and Other Pacific Islander alone", table: B19113E}
      - {group: "Some other race alone",                        table: B19113F}
      - {group: "Two or more races",                            table: B19113G}
      - {group: "White alone, not Hispanic or Latino",          table: B19113H}
      - {group: "Hispanic or Latino (any race)",                table: B19113I}
    components:
      median: ["001"]
    measures:
      - id: median_family_income
        label: "Median family income (dollars)"
        type: value
        unit: dollars
        component: median
        note: "In that survey year's dollars, not adjusted for inflation."

  # ---- PUMS microdata (built by R/pums.R; groups and measures are fixed there).

  - id: child_housing_cost_burden
    status: active
    name: Children in households paying 30% or more (and 50% or more) of income on housing
    vital_condition: Humane Housing
    source: pums
    surveys: [acs1, acs5]
    geographies: [puma]
    universe: Children under 18 in households
    disaggregations: [race_ethnicity, tenure]
    legacy_vintage: {label: "2015-2019 ACS 5-year PUMS", year: 2019, survey: acs5, verified: false, basis: "Assumed from the project brief; not yet checked"}
    notes: Built from PUMS microdata with replicate weights (milestone 3). The three PUMAs together cover exactly Forsyth County.
